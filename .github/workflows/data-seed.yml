name: T610YP Data seed

on:
  workflow_dispatch:
    inputs:
      os_target:
        description: System image used to prepare Data
        required: true
        default: iphone-x-16.7.16
        type: choice
        options:
          - ipados-17.7.11
          - iphone-17.7
          - iphone-x-16.7.16
      data_gib:
        description: Logical APFS Data size in GiB (3 to 18)
        required: true
        default: "8"
        type: string
      skip_setup:
        description: Also generate a seed with Setup marked complete
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  data-seed:
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: unixnu
    steps:
      - name: Check out T610YP seed adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: device
          persist-credentials: false

      - name: Check out pinned UniXNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: f0721e9745c45ad2600cd69c74730f1cca55d56a
          path: unixnu
          persist-credentials: false

      - name: Prepare DarwinBoot tools and validate size
        env:
          DATA_GIB: ${{ inputs.data_gib }}
        run: |
          set -euo pipefail
          [[ "$DATA_GIB" =~ ^([3-9]|1[0-8])$ ]] || {
            echo "::error::data_gib must be a whole number from 3 to 18"
            exit 1
          }
          git submodule update --init --depth 1 drivers/DarwinBoot
          mkdir -p build .cache/firmware/target-volumes
          df -h "$GITHUB_WORKSPACE"

      - name: Download and verify OS image
        env:
          OS_TARGET: ${{ inputs.os_target }}
        run: |
          set -euo pipefail
          case "$OS_TARGET" in
            ipados-17.7.11)
              url='https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw'
              ;;
            iphone-17.7)
              url='https://updates.cdn-apple.com/2024FallFCS/fullrestores/062-78994/7B1C92E8-587E-4F7E-BB51-1DCADA45517B/iPhone12,1_17.7_21H16_Restore.ipsw'
              ;;
            iphone-x-16.7.16)
              url='https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw'
              ;;
            *) echo "::error::Unsupported OS target"; exit 1 ;;
          esac
          curl --fail --location --retry 3 --connect-timeout 30 \
            "$url" --output "$RUNNER_TEMP/restore.ipsw"
          if [ "$OS_TARGET" != ipados-17.7.11 ]; then
            python3 "$GITHUB_WORKSPACE/device/scripts/iphone17-seed.py" extract \
              "$RUNNER_TEMP/restore.ipsw" .cache/firmware/target-volumes/iphone-os.dmg \
              --target "$OS_TARGET"
            echo "OS_IMAGE=.cache/firmware/target-volumes/iphone-os.dmg" >> "$GITHUB_ENV"
          else
            python3 scripts/extract-target-volume.py OS --ipsw "$RUNNER_TEMP/restore.ipsw"
            os_image=.cache/firmware/target-volumes/044-76040-038.dmg
            printf '%s  %s\n' \
              3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d \
              "$os_image" | shasum -a 256 --check
            echo "OS_IMAGE=$os_image" >> "$GITHUB_ENV"
          fi
          rm "$RUNNER_TEMP/restore.ipsw"

      - name: Create APFS Data seed
        env:
          OS_TARGET: ${{ inputs.os_target }}
        run: |
          set -euo pipefail
          if [ "$OS_TARGET" != ipados-17.7.11 ]; then
            python3 "$GITHUB_WORKSPACE/device/scripts/iphone17-seed.py" prepare "$PWD" \
              "$OS_IMAGE" --target "$OS_TARGET"
          else
            mountpoint="$PWD/.cache/firmware/target-volumes/os-mount"
            mkdir -p "$mountpoint"
            hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$OS_IMAGE"
            cleanup() {
              hdiutil detach "$mountpoint" || hdiutil detach -force "$mountpoint"
            }
            trap cleanup EXIT
            python3 scripts/prepare-owner-data-fixture.py
            trap - EXIT
            cleanup
          fi
          rm "$OS_IMAGE"

      - name: Pack and grow Data seed
        env:
          DATA_GIB: ${{ inputs.data_gib }}
        run: |
          set -euo pipefail
          python3 drivers/DarwinBoot/Test/packed_ramdisk.py \
            build/owner-data-fixture/owner-data-32.cdr \
            build/owner-data-fixture/owner-data-base.dbr
          python3 scripts/seed-data-grow.py --gib "$DATA_GIB" \
            build/owner-data-fixture/owner-data-base.dbr \
            build/owner-data-fixture/owner-data.dbr \
            > build/owner-data-fixture/grow-report.json
          cd build/owner-data-fixture
          shasum -a 256 owner-data.dbr seed.json grow-report.json > SHA256SUMS

      - name: Upload Data seed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t610yp-${{ inputs.os_target }}-data-seed-${{ inputs.data_gib }}g
          path: |
            unixnu/build/owner-data-fixture/owner-data.dbr
            unixnu/build/owner-data-fixture/seed.json
            unixnu/build/owner-data-fixture/grow-report.json
            unixnu/build/owner-data-fixture/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Generate skip-Setup Data seed
        if: ${{ inputs.skip_setup }}
        env:
          OS_TARGET: ${{ inputs.os_target }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/device/scripts/iphone17-seed.py" adapt-skip-setup "$PWD" \
            --target "$OS_TARGET"
          python3 scripts/t610yp-seed-data-skip-setup.py \
            build/owner-data-fixture/owner-data.dbr \
            build/owner-data-fixture/owner-data-skip-setup.dbr \
            --no-auto-dim
          cd build/owner-data-fixture
          shasum -a 256 owner-data-skip-setup.dbr \
            owner-data-skip-setup.json > SKIP-SETUP-SHA256SUMS

      - name: Upload skip-Setup Data seed
        if: ${{ inputs.skip_setup }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t610yp-${{ inputs.os_target }}-data-seed-skip-setup-${{ inputs.data_gib }}g
          path: |
            unixnu/build/owner-data-fixture/owner-data-skip-setup.dbr
            unixnu/build/owner-data-fixture/owner-data-skip-setup.json
            unixnu/build/owner-data-fixture/SKIP-SETUP-SHA256SUMS
          if-no-files-found: error
          retention-days: 7
